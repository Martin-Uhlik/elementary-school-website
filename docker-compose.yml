# The whole site: docker compose up -d
# Settings come from .env next to this file (copy .env.example).
# web and migrate are the images GitHub Actions builds on every push to main and pushes to Docker Hub
# (.github/workflows/docker.yml); the server pulls them (deploy/update/zsmp-update.sh). "docker compose up -d --build"
# builds the same images here from src/ instead, e.g. to try a change before pushing it.
services:
  # The public web server: HTTPS (automatic Let's Encrypt certificate), http → https, www → zsmp.cz,
  # and the visitor's real address for the admin's IP check (deploy/caddy/Caddyfile)
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # zsmp.cz in production; ":80" for plain http on a dev machine
      SITE_ADDRESS: ${SITE_ADDRESS:-zsmp.cz, www.zsmp.cz}
    volumes:
      # Z: relabel for SELinux (AlmaLinux), no effect elsewhere
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      # the certificates; keep this volume, or Caddy has to ask Let's Encrypt again
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  web:
    # IMAGE_TAG: latest = the newest build of main, or sha-<commit> to stay on (roll back to) one build
    image: ${DOCKERHUB_NAMESPACE:-missing-dockerhub-namespace}/zsmp-web:${IMAGE_TAG:-latest}
    # built from src/ because the app imports the tables from src/db
    build:
      context: ./src
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      # only for this machine (curl, an SSH tunnel); the public traffic comes through caddy. Nothing else may reach
      # the site directly, because the admin's IP check trusts the X-Forwarded-For header that caddy sets
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      # photos and documents stay on the host (MEDIA_DIR), so they survive rebuilds; the admin (/auth) uploads into
      # galerie/, dokument/ and pozadi/, so the folder must be writable for the container's user (uid 1000).
      # Z: relabel for SELinux (AlmaLinux), no effect elsewhere
      - ${MEDIA_DIR:-./media}:/app/media:Z
      - ${MEDIA_DIR:-./media}/videos:/app/web/public/data/videos:ro,Z
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # set to false only to try the admin over plain http (SITE_ADDRESS=:80, no HTTPS)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # IP addresses / CIDR ranges that may open /admin and /auth (others get 404); empty = nobody
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      # admin time limits (src/web/lib/auth/config.ts), in minutes / attempts
      AUTH_INACTIVITY_MINUTES: ${AUTH_INACTIVITY_MINUTES:-30}
      AUTH_SESSION_MAX_MINUTES: ${AUTH_SESSION_MAX_MINUTES:-480}
      AUTH_LOCKOUT_ATTEMPTS: ${AUTH_LOCKOUT_ATTEMPTS:-5}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES:-10}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-180}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Runs once on every "up": applies new migrations (src/db/migrations), then fills an empty database
  # (the site's content and the user admin / zsmp); existing data is left alone. Only src/db, no Next.js.
  migrate:
    image: ${DOCKERHUB_NAMESPACE:-missing-dockerhub-namespace}/zsmp-migrate:${IMAGE_TAG:-latest}
    build:
      context: ./src
      dockerfile: db/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # Czech collation, so ORDER BY puts "Č" after "C" and "Ch" after "H" (applies when the volume is created)
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=icu --icu-locale=cs-CZ
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # for a database tool on this machine (pgAdmin, DBeaver); never open it to the network
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18/docker; the named volume survives
      # restarts and rebuilds, only "docker compose down -v" deletes it
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  caddy-data:
  caddy-config:
