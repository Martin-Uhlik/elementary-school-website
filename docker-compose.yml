# The whole site: docker compose up -d --build
# Settings come from .env next to this file (copy .env.example).
services:
  web:
    build: ./src/web
    restart: unless-stopped
    ports:
      # IIS forwards the public traffic here; WEB_BIND is 127.0.0.1 when IIS runs on the same machine
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    volumes:
      # photos and documents stay on the host (MEDIA_DIR), so they survive rebuilds; the admin (/auth) uploads into
      # galerie/ and dokument/, so the folder must be writable for the container's user (uid 1000)
      - ${MEDIA_DIR:-./media}:/app/media
      - ${MEDIA_DIR:-./media}/videos:/app/public/data/videos:ro
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # set to false only to try the admin over plain http (without IIS and HTTPS)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # admin time limits (src/web/lib/auth/config.ts), in minutes / attempts
      AUTH_INACTIVITY_MINUTES: ${AUTH_INACTIVITY_MINUTES:-30}
      AUTH_SESSION_MAX_MINUTES: ${AUTH_SESSION_MAX_MINUTES:-480}
      AUTH_LOCKOUT_ATTEMPTS: ${AUTH_LOCKOUT_ATTEMPTS:-5}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Runs once on every "up": applies new Prisma migrations, then fills an empty database
  # (the site's content and the user admin / zsmp); existing data is left alone
  migrate:
    build:
      context: ./src/web
      target: build
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./src/db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # for a database tool on this machine (pgAdmin, DBeaver); never open it to the network
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18/docker; the named volume survives
      # restarts and rebuilds, only "docker compose down -v" deletes it
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
