# Docker images for the server: on every push to main that changes src/, build the web and migrate images and push
# them to Docker Hub as :latest and :sha-<commit>. The VM picks them up by itself within 10 minutes
# (deploy/update/zsmp-update.sh, docs/deploy.md section 11).
#
# Needs in GitHub → repo → Settings → Secrets and variables → Actions:
#   variable DOCKERHUB_USERNAME  the Docker Hub account (the same as DOCKERHUB_NAMESPACE in the server's .env)
#   secret   DOCKERHUB_TOKEN     a Docker Hub personal access token with "Read & Write" access
#
# NOT SET UP YET (2026-11-19): until the variable DOCKERHUB_USERNAME exists, every run is skipped (grey in the Actions
# tab, not a failure) and nothing is built or pushed. Setting it up = docs/deploy.md section 1; no change here needed.
name: Docker images

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/docker.yml"
  # "Run workflow" button in the Actions tab, e.g. to rebuild after changing the token
  workflow_dispatch:

# one build at a time; a newer push replaces a waiting one, so :latest always ends up as the newest commit
concurrency:
  group: docker-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    # skipped until Docker Hub is set up (see the note at the top)
    if: vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB: ${{ vars.DOCKERHUB_USERNAME }}/zsmp-web
      MIGRATE: ${{ vars.DOCKERHUB_USERNAME }}/zsmp-migrate
    steps:
      - uses: actions/checkout@v5

      - name: Short commit id
        id: commit
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build both images first and push only when both built, so the server never gets a new web without its
      # migrations. The push steps reuse the build cache, so they don't build again.
      - name: Build migrate
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/db/Dockerfile
          platforms: linux/amd64
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/web/Dockerfile
          platforms: linux/amd64
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # migrate first: if the server updates between the two pushes, the database is ready before the new web
      - name: Push migrate
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/db/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.MIGRATE }}:latest
            ${{ env.MIGRATE }}:${{ steps.commit.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=migrate

      - name: Push web
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB }}:latest
            ${{ env.WEB }}:${{ steps.commit.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web

      - name: Summary
        run: |
          echo "Pushed \`$WEB\` and \`$MIGRATE\` as \`latest\` and \`${{ steps.commit.outputs.sha }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Roll back to this build on the server: \`IMAGE_TAG=${{ steps.commit.outputs.sha }}\` in .env." >> "$GITHUB_STEP_SUMMARY"
