# The site for development: Next.js dev server with hot reload, plus the database. Nothing needs Node on this machine.
#   docker compose -f docker-compose.dev.yml up
# src/ is mounted into the containers, so a saved file shows up in the browser at once. The packages are installed
# inside (Linux builds of sharp and Next), in a volume, never into src/node_modules on this machine.
# Settings come from .env next to this file (POSTGRES_*, MEDIA_DIR, ports); docker-compose.yml stays for production.

# own project name, so the dev database and volumes are separate from a production run on the same machine
name: zsmp-dev

x-node: &node
  image: node:26-alpine
  volumes:
    - ./src:/app
    # packages live in volumes, so the Mac's src/node_modules (if any) is never used
    - node-modules:/app/node_modules
    - web-node-modules:/app/web/node_modules
    - db-node-modules:/app/db/node_modules
  environment: &node-env
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    NEXT_TELEMETRY_DISABLED: 1

services:
  # Next.js dev server on http://localhost:3000, admin on /admin (everyone may open it: ADMIN_ALLOWED_IPS is unset)
  web:
    <<: *node
    working_dir: /app/web
    command: npx next dev --hostname 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./src:/app
      - node-modules:/app/node_modules
      - web-node-modules:/app/web/node_modules
      - db-node-modules:/app/db/node_modules
      # Next's build cache stays in the container (faster than writing it to the Mac)
      - next-cache:/app/web/.next
      - ${MEDIA_DIR:-./media}:/media
      - ${MEDIA_DIR:-./media}/videos:/app/web/public/data/videos:ro
    environment:
      <<: *node-env
      MEDIA_DIR: /media
      # if saved files don't reload (rare with Docker Desktop), uncomment: watch by polling instead of file events
      # WATCHPACK_POLLING: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # On every start: installs the packages when package-lock.json changed, applies new migrations (src/db/migrations)
  # and fills an empty database. Runs from the mounted src/, so a new migration needs only a restart, no rebuild.
  migrate:
    <<: *node
    working_dir: /app
    command: sh -c "([ node_modules/.package-lock.json -nt package-lock.json ] || npm ci) && npm run db:migrate && npm run db:seed"
    depends_on:
      db:
        condition: service_healthy

  # the same database as in production (docker-compose.yml)
  db:
    extends:
      file: docker-compose.yml
      service: db

volumes:
  db-data:
  node-modules:
  web-node-modules:
  db-node-modules:
  next-cache:
